[tool.ruff]
# Match Black's standard line length
line-length = 88

# Target your project's Python version
target-version = "py311"

[tool.ruff.lint]
# Enable Ruff's key rule sets:
# E, F  → pycodestyle + pyflakes
# W     → warnings
# B     → bugbear (common bug prevention)
select = ["E", "F", "W", "B"]

# Ignore line-length warnings (E501) because Black handles wrapping.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The server module prints its paths and builds the app between imports
"backend/api_server.py" = ["E402"]


[tool.black]
line-length = 88
target-version = ["py311"]