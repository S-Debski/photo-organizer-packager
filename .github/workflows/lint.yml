name: Lint & Format

on:
  push:
  pull_request:

jobs:
  lint:
    name: Ruff & Black checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Black (check only)
        run: |
          black --check .