name: Build desktop apps

# Builds the standalone Windows and macOS apps.
#   Run from the Actions tab -> workflow artifacts only (for testing).
#   Push a v* tag            -> also publishes a GitHub Release with both
#                               zips attached (tags with a "-", e.g.
#                               v3.0.0-beta.2, are marked pre-release).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon)
    # Pinned rather than macos-latest: -latest moves to new macOS versions
    # gradually (and their runner pools can be slow to start), and an app
    # built on an older macOS runs on more Macs. Move up deliberately.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt pyinstaller
          chmod +x build_mac.sh
          ./build_mac.sh
      - uses: actions/upload-artifact@v6
        with:
          name: PhotoOrganizer-mac
          path: dist/PhotoOrganizer-mac.zip

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch ExifTool
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest https://exiftool.org/ver.txt).Content.Trim()
          # exiftool.org links its downloads to SourceForge
          curl.exe -fsSL -o et.zip "https://sourceforge.net/projects/exiftool/files/exiftool-${ver}_64.zip/download"
          Expand-Archive et.zip -DestinationPath et
          $dir = (Get-ChildItem et -Directory | Select-Object -First 1).FullName
          Rename-Item (Join-Path $dir "exiftool(-k).exe") "exiftool.exe"
          "EXIFTOOL_DIR=$dir" >> $env:GITHUB_ENV
      - name: Build
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -q -r requirements.txt pyinstaller
          build.bat
      - uses: actions/upload-artifact@v6
        with:
          name: PhotoOrganizer-windows
          path: dist/Photo Organizer/

  release:
    name: Publish release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only this job can create the release
    steps:
      - uses: actions/download-artifact@v6
        # -> PhotoOrganizer-mac/PhotoOrganizer-mac.zip
        #    PhotoOrganizer-windows/<contents of dist/Photo Organizer>
      - name: Zip the Windows app
        run: |
          mv PhotoOrganizer-windows "Photo Organizer"
          zip -qr PhotoOrganizer-windows.zip "Photo Organizer"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## Download

          - **Windows:** `PhotoOrganizer-windows.zip`. Unzip, open the
            `Photo Organizer` folder and run `Photo Organizer.exe`.
            Windows may say it protected your PC (the app isn't
            code-signed): click **More info** -> **Run anyway**.
          - **Mac (Apple Silicon, macOS 15 or later):**
            `PhotoOrganizer-mac.zip`. Unzip and move `Photo Organizer.app`
            to Applications. First launch: right-click it -> **Open** ->
            **Open** (the app isn't code-signed). If macOS says it's damaged,
            run once in Terminal, then open it normally:
            `xattr -dr com.apple.quarantine "/Applications/Photo Organizer.app"`

          ExifTool is included. See readme.txt for details.
          EOF
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Photo Organizer $TAG" \
            --notes-file notes.md --generate-notes $prerelease \
            PhotoOrganizer-windows.zip \
            PhotoOrganizer-mac/PhotoOrganizer-mac.zip
